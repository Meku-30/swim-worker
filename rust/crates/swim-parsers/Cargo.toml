[package]
name = "swim-parsers"
version = "0.1.0"
edition = "2021"
publish = false
description = "SWIM の応答の解析 (Worker と Coordinator が共有する)"

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
ryu = "1.0.23"
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
