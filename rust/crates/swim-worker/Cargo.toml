[package]
name = "swim-worker"
version = "1.3.0"
edition = "2021"
publish = false

[lib]
name = "swim_worker"
path = "src/lib.rs"

[[bin]]
name = "swim-worker"
path = "src/main.rs"

[dependencies]
swim-http = { path = "../swim-http" }
swim-parsers = { path = "../swim-parsers" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.21"
tracing = "0.1.44"
fs4 = { version = "0.13", features = ["sync"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
