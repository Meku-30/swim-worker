[package]
name = "swim-worker"
version = "1.3.0-rc1"
edition = "2021"
publish = false

[lib]
name = "swim_worker"
path = "src/lib.rs"

[[bin]]
name = "swim-worker"
path = "src/main.rs"

[dependencies]
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["cookies"] }
swim-http = { path = "../swim-http" }
swim-parsers = { path = "../swim-parsers" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.21"
tracing = "0.1.44"
async-trait = "0.1"
redis = { version = "=1.8.1", default-features = false, features = ["tokio-rustls-comp", "aio"] }
rand = "0.9"
rand_distr = "0.5"
url = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
ipnet = "2"
# Redis の TLS (rustls) の暗号の実装。1 つだけ有効にすると自動で選ばれる (無いと接続のときに panic する)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
fs4 = { version = "0.13", features = ["sync"] }
# 更新の署名 (Ed25519) と SHA-256 (rustls と同じ ring)
ring = "0.17"
# 更新の本体を少しずつ取る (wreq の応答は http_body::Body)
http-body-util = "0.1.5"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "fs"] }

[features]
# 試運転用: SWIM の代わりに偽物 (ネットに出ない) で動く。配布物には入れない
trial = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Security_Credentials", "Win32_Globalization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# GUI (Windows 標準の部品。M1 の試作で決めた)
native-windows-gui = { version = "=1.0.13", default-features = false, features = ["textbox", "tray-notification", "menu", "frame", "image-decoder", "animation-timer", "message-window", "progress-bar", "cursor"] }

[[bin]]
name = "swim-worker-gui"
path = "src/bin/swim-worker-gui.rs"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
