[package]
name = "swim-worker"
version = "1.3.0"
edition = "2021"
publish = false

[lib]
name = "swim_worker"
path = "src/lib.rs"

[[bin]]
name = "swim-worker"
path = "src/main.rs"

[dependencies]
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["cookies"] }
swim-http = { path = "../swim-http" }
swim-parsers = { path = "../swim-parsers" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.21"
tracing = "0.1.44"
async-trait = "0.1"
redis = { version = "=1.8.1", default-features = false, features = ["tokio-rustls-comp", "aio"] }
rand = "0.9"
rand_distr = "0.5"
url = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
ipnet = "2"
fs4 = { version = "0.13", features = ["sync"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
