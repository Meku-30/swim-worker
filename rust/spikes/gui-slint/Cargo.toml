[package]
name = "gui-slint"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
tray-icon = "=0.26.1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
