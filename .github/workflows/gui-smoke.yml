name: GUI Smoke Test

# GUI (tkinter) は画面が要るので Windows / macOS の runner で起動確認する。
# Linux のテストはヘッドレスなので GUI の画面のテストは skip される
# (ローカルでは xvfb-run があれば DISPLAY を与えて走らせられる)。
on:
  push:
    branches: [master]
    paths:
      - 'swim_worker/gui*.py'
      - 'swim_worker/autostart.py'
      - 'swim_worker/settings_store.py'
      - 'swim_worker/updater.py'
      - 'swim_worker/update_verify.py'
      - 'swim_worker/update_check.py'
      - 'swim_worker/release_keys.py'
      - 'swim_worker/worker_runner.py'
      - 'swim_worker/icon.py'
      - 'swim_worker/paths.py'
      - 'swim_worker/config.py'
      - 'swim_worker/consumer.py'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - 'tests/test_gui_*.py'
      - 'tests/test_settings_store.py'
      - '.github/workflows/gui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke:
    strategy:
      fail-fast: false
      matrix:
        # build-release.yml と同じ runner に固定
        os: [windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies (hash-locked)
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Install tkinter (macOS)
        if: runner.os == 'macOS'
        run: brew install python-tk@3.11

      # 画面のテストと、GUI だけが使うモジュール (Windows の mbcs・本物の資格情報ストア) のテスト
      - name: Run GUI tests
        run: >-
          python -m pytest -v -rs -o faulthandler_timeout=60
          tests/test_gui_smoke.py tests/test_gui_modules.py tests/test_gui_helpers.py
          tests/test_settings_store.py
